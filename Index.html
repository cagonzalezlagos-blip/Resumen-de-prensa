<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2d4a">
<title>Resumen de Prensa</title>
<style>
*{box-sizing:border-box}:root{--bg:#f3f6f9;--ink:#172133;--muted:#667085;--line:#d9e1ea;--navy:#0f2d4a;--accent:#a9801c}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
header{background:var(--navy);color:white;padding:16px}header h1{margin:2px 0;font-size:23px}header small{opacity:.75;font-weight:800;letter-spacing:.12em}
main{max-width:920px;margin:auto;padding:15px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
button,input,textarea,select{font:inherit}button{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;padding:10px 13px;font-weight:800}
#search,.active{background:var(--navy);color:white}.accent{background:var(--accent);color:white;border-color:var(--accent)}
.switch,.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap}.switch{margin-bottom:12px}.actions{margin-top:12px}.tabs{margin-bottom:10px;overflow:auto}.tabs button{white-space:nowrap;border-radius:999px;padding:7px 11px}
label{display:flex;flex-direction:column;gap:6px;font-weight:750;font-size:13px}input,textarea,select{border:1px solid var(--line);border-radius:9px;padding:10px;width:100%;background:#fff}
.hero{display:grid;grid-template-columns:1fr 1.35fr;gap:14px}.period{border-left:4px solid var(--accent);background:#fbf8ee;border-radius:10px;padding:10px 12px}.period span{font-size:11px;color:#77621c;font-weight:800}.period strong{display:block}
.notice{font-size:13px;color:#455268;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}.stat span{font-size:11px;color:var(--muted);display:block}.stat strong{font-size:22px;color:var(--navy)}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0}.item h3{font-size:15px;margin:0 0 6px}.meta{font-size:11px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap}.badge{padding:3px 7px;border-radius:999px;background:#edf2f6;font-weight:800}.item p{font-size:13px;line-height:1.45;color:#455268}.include{display:flex;flex-direction:row;align-items:center;gap:7px}.include input{width:auto}
#result{width:100%;min-height:440px;margin-top:12px;font-family:monospace;line-height:1.45}.hidden{display:none!important}
dialog{width:min(680px,94vw);border:0;border-radius:16px}dialog::backdrop{background:rgba(0,0,0,.45)}#form{display:flex;flex-direction:column;gap:10px}.small{font-size:12px;color:var(--muted)}
@media(max-width:720px){.hero{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><small>TRABAJO · PRENSA</small><h1>Resumen de Prensa</h1></header>
<main>
<section class="card">
<div class="hero">
<div><div class="switch"><button id="am" class="active">AM</button><button id="pm">PM</button></div><label>Fecha del informe<input id="date" type="date"></label></div>
<div class="period"><span>PERIODO ANALIZADO</span><strong id="period"></strong><div class="small">Se considera la hora de publicación de la fuente.</div></div>
</div>
<div class="actions"><button id="search">🔎 Buscar noticias</button><button id="manual">+ Agregar manualmente</button><button id="generate" class="accent">Generar resumen</button></div>
<div id="status" class="notice"></div>
</section>
<section class="stats">
<div class="stat"><span>Encontradas</span><strong id="sTotal">0</strong></div><div class="stat"><span>Seleccionadas</span><strong id="sInc">0</strong></div><div class="stat"><span>Nacional</span><strong id="sNat">0</strong></div><div class="stat"><span>Regional/Policial</span><strong id="sReg">0</strong></div>
</section>
<section class="card"><h2>Revisión de noticias</h2><div class="tabs"><button data-filter="all" class="active">Todas</button><button data-filter="national">Nacional</button><button data-filter="regional">Regional</button><button data-filter="police">Policial</button></div><div id="news"></div><p id="empty" class="small">Sin noticias. Presiona “Buscar noticias”.</p></section>
<section class="card hidden" id="resultCard"><h2>Informe generado</h2><div class="actions"><button id="copy">Copiar</button><button id="share">Compartir</button></div><textarea id="result"></textarea></section>
</main>
<dialog id="dlg"><form id="form"><h3>Agregar noticia</h3><input id="title" placeholder="Título" required><textarea id="summary" rows="6" placeholder="Resumen" required></textarea><input id="url" type="url" placeholder="Enlace"><input id="published" type="datetime-local" required><select id="category"><option value="national">CONTINGENCIA NACIONAL</option><option value="regional">CONTINGENCIA REGIONAL</option><option value="police">CONTINGENCIA POLICIAL</option></select><div class="actions"><button type="button" id="cancel">Cancelar</button><button type="submit">Guardar</button></div></form></dialog>
<script>
const $=x=>document.getElementById(x);let type="AM",items=[],filter="all";
const pad=n=>String(n).padStart(2,"0");
function range(){let[y,m,d]=$("date").value.split("-").map(Number);return type==="AM"?[new Date(y,m-1,d-1,17,15),new Date(y,m-1,d,8,15)]:[new Date(y,m-1,d,8,15),new Date(y,m-1,d,17,15)]}
function fd(d){return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function update(){let[a,b]=range();$("period").textContent=`${fd(a)} → ${fd(b)}`;$("am").classList.toggle("active",type==="AM");$("pm").classList.toggle("active",type==="PM")}
function stats(){$("sTotal").textContent=items.length;$("sInc").textContent=items.filter(x=>x.included).length;$("sNat").textContent=items.filter(x=>x.category==="national").length;$("sReg").textContent=items.filter(x=>x.category!=="national").length}
function esc(s=""){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function render(){$("news").innerHTML="";let show=filter==="all"?items:items.filter(x=>x.category===filter);$("empty").hidden=show.length>0;show.sort((a,b)=>new Date(a.published)-new Date(b.published)).forEach(x=>{let e=document.createElement("div");e.className="item";e.innerHTML=`<h3>${esc(x.title)}</h3><div class="meta"><span class="badge">${x.category==="national"?"CONTINGENCIA NACIONAL":x.category==="regional"?"CONTINGENCIA REGIONAL":"CONTINGENCIA POLICIAL"}</span><span>${fd(new Date(x.published))}</span><span>${esc(x.source||"")}</span></div><p>${esc(x.summary||"")}</p>${x.url?`<a href="${x.url}" target="_blank">Abrir fuente</a>`:""}<label class="include"><input type="checkbox" ${x.included?"checked":""} data-id="${x.id}"> Incluir en informe</label>`;$("news").appendChild(e)});stats()}
$("news").onchange=e=>{if(e.target.dataset.id){let x=items.find(i=>i.id===e.target.dataset.id);x.included=e.target.checked;stats()}}
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-filter]").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;render()})
async function search(){let btn=$("search"),[a,b]=range();btn.disabled=true;$("status").textContent="Buscando noticias desde el servidor…";try{let q=new URLSearchParams({start:a.toISOString(),end:b.toISOString(),type,date:$("date").value});let r=await fetch("/api/search?"+q.toString(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);let data=await r.json();items=(data.news||[]).map(x=>({...x,id:crypto.randomUUID(),included:x.included!==false}));render();$("status").textContent=items.length?`Se encontraron ${items.length} noticias dentro del periodo. Revísalas antes de generar el informe.`:"La búsqueda terminó sin resultados dentro del periodo seleccionado."}catch(e){$("status").textContent="No fue posible consultar el servidor de noticias. Revisa que el backend /api/search esté publicado en Vercel."}finally{btn.disabled=false}}
function report(){let[y,m,d]=$("date").value.split("-");let o=`*RESUMEN DE PRENSA ${type} ${d}/${m}/${y}*

`;for(let c of["national","regional","police"]){let name=c==="national"?"CONTINGENCIA NACIONAL":c==="regional"?"CONTINGENCIA REGIONAL":"CONTINGENCIA POLICIAL";o+=`*${name}*

`;items.filter(x=>x.included&&x.category===c).forEach(x=>{o+=`*${x.title}*

${x.summary}

${x.url?x.url+"

":""}`})}return o.trim()}
$("am").onclick=()=>{type="AM";update()};$("pm").onclick=()=>{type="PM";update()};$("date").onchange=update;$("search").onclick=search;$("generate").onclick=()=>{$("result").value=report();$("resultCard").classList.remove("hidden");$("resultCard").scrollIntoView({behavior:"smooth"})};$("copy").onclick=async()=>navigator.clipboard.writeText($("result").value);$("share").onclick=()=>navigator.share?navigator.share({text:$("result").value}):navigator.clipboard.writeText($("result").value);
$("manual").onclick=()=>{$("form").reset();$("dlg").showModal()};$("cancel").onclick=()=>$("dlg").close();$("form").onsubmit=e=>{e.preventDefault();items.push({id:crypto.randomUUID(),title:$("title").value,summary:$("summary").value,url:$("url").value,published:$("published").value,category:$("category").value,source:"Manual",included:true});render();$("dlg").close()};
let n=new Date();$("date").value=`${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`;update();
</script>
</body></html>
